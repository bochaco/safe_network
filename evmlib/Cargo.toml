[package]
authors = ["MaidSafe Developers <dev@maidsafe.net>"]
description = "Safe Network EVM"
edition = "2024"
homepage = "https://maidsafe.net"
license = "GPL-3.0"
name = "evmlib"
repository = "https://github.com/maidsafe/autonomi"
version = "0.4.2"

[features]
external-signer = []

[dependencies]
alloy = { version = "0.15.6", default-features = false, features = ["contract", "json-rpc", "network", "node-bindings", "provider-http", "reqwest-rustls-tls", "rpc-client", "rpc-types", "signer-local", "std"] }
futures-util = "0.3.31"
serde = "1"
serde_with = { version = "3.11.0", features = ["macros"] }
thiserror = "1.0"
tracing = { version = "~0.1.26" }
tokio = "1.43.1"
rand = "0.8.5"
lnd_grpc_rust = { version = "2.11.0", path = "../../lnd-grpc-rust" }
hex = "0.4.3"
#ark-client = { path = "../../ark-rust-sdk/ark-client" }
#ark-core = { path = "../../ark-rust-sdk/ark-core" }
ark-bdk-wallet = { version = "0.7.0", git = "https://github.com/arkade-os/rust-sdk.git" }
ark-rs = { version = "0.7.0", git = "https://github.com/arkade-os/rust-sdk.git", features = ["client"] }
bitcoin = "0.32.6"
esplora-client = { version = "0.10", features = ["async-https"] }
reqwest = "0.12.22"
serde_json = "1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
